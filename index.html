<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030304" />
    <title>Hardik Gehlot — Creative Video Editor &amp; Motion Designer</title>
    <meta name="description" content="I transform ideas into visually compelling stories through editing, motion design and cinematic visual experiences." />
    <!-- Display face is self-hosted and preloaded so the title never swaps late -->
    <link rel="preload" href="/fonts/cormorant-garamond-300.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cormorant-garamond-400.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // apply the remembered theme before first paint (dark by default)
      try { if (localStorage.getItem('hg-theme') === 'light') document.documentElement.dataset.theme = 'light' } catch (e) {}
    </script>
    <style>
      /* critical: stage colour before any JS/CSS so there is never a flash */
      html, body { background: #030304; margin: 0; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f3f0ea; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
